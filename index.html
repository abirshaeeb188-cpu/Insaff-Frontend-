<!doctype html>
<html lang="en">
  <head>
    <!-- figma:head-start -->
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />

    <!-- ===== Primary SEO ===== -->
    <title>
      INSAF Sand Trading Company | Premium Construction Materials Supplier
    </title>
    <meta
      name="description"
      content="INSAF Sand Trading Company supplies premium sand, aggregates, and construction materials with reliable order tracking, instant quotes, and dedicated customer support." />
    <meta
      name="keywords"
      content="sand trading, construction materials, aggregates supplier, sand supplier UAE, building materials, INSAF trading" />
    <meta name="author" content="INSAF Sand Trading Company" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://www.yourdomain.com/" />

    <!-- ===== Favicon ===== -->
    <link rel="icon" href="/favicon.ico" sizes="any" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#14202B" />

    <!-- ===== Open Graph (Facebook, LinkedIn, WhatsApp) ===== -->
    <meta property="og:type" content="website" />
    <meta
      property="og:title"
      content="INSAF Sand Trading Company | Premium Construction Materials Supplier" />
    <meta
      property="og:description"
      content="Reliable sand and aggregate supply for your construction needs — order tracking, instant quotes, and dedicated support." />
    <meta
      property="og:image"
      content="https://www.yourdomain.com/og-image.jpg" />
    <meta property="og:url" content="https://www.yourdomain.com/" />
    <meta property="og:site_name" content="INSAF Sand Trading Company" />
    <meta property="og:locale" content="en_US" />

    <!-- ===== Twitter Card ===== -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta
      name="twitter:title"
      content="INSAF Sand Trading Company | Premium Construction Materials Supplier" />
    <meta
      name="twitter:description"
      content="Reliable sand and aggregate supply for your construction needs — order tracking, instant quotes, and dedicated support." />
    <meta
      name="twitter:image"
      content="https://www.yourdomain.com/og-image.jpg" />

    <!-- ===== Structured Data (JSON-LD) ===== -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Organization",
        "name": "INSAF Sand Trading Company",
        "url": "https://www.yourdomain.com/",
        "logo": "https://www.yourdomain.com/logo.png",
        "description": "Premium sand, aggregates, and construction materials supplier."
      }
    </script>
    <!-- figma:head-end -->
  </head>
  <body>
    <!-- figma:body-start -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    <!-- figma:body-end -->
  </body>
</html>
